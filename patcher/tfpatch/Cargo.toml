[package]
name = "tfpatch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.11.0"
qbsdiff = "1.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.4.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
