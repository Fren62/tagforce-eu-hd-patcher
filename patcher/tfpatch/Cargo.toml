[package]
build = "build.rs"
name = "tfpatch"
version = "0.3.0"
edition = "2024"
description = "Patcher for Yu-Gi-Oh! GX Tag Force 1 (EU, ULES00600 v1.01): corrected texts, HD textures, single-language ISO"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.11.0"
qbsdiff = "1.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.4.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# solo interfaccia grafica
eframe = { version = "0.36.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
rfd = { version = "0.17.2", optional = true }
sys-locale = { version = "0.3.2", optional = true }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image", "dep:rfd", "dep:sys-locale"]

[[bin]]
name = "tfpatch-gui"
path = "src/bin/tfpatch-gui.rs"
required-features = ["gui"]

[profile.release]
strip = true
lto = "thin"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
