name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the binaries to (e.g. v0.1.0). Leave empty to only build.'
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bin: tfpatch
            asset: tfpatch-linux-x86_64
          - os: windows-latest
            bin: tfpatch.exe
            asset: tfpatch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust (edition 2024 needs a recent stable)
        shell: bash
        run: rustup update stable && rustc --version
      - name: Build
        shell: bash
        working-directory: patcher/tfpatch
        run: cargo build --release --locked
      - name: Rename binary
        shell: bash
        run: cp "patcher/tfpatch/target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --repo "$REPO" --clobber
