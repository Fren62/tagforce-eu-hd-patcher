name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the binaries to (e.g. v0.2.0). Leave empty to only build.'
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cli: tfpatch
            cli_asset: tfpatch-linux-x86_64
            gui: tfpatch-gui
            gui_asset: tfpatch-gui-linux-x86_64
          - os: windows-latest
            cli: tfpatch.exe
            cli_asset: tfpatch.exe
            gui: tfpatch-gui.exe
            gui_asset: tfpatch-gui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies (GUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Update Rust (edition 2024 needs a recent stable)
        shell: bash
        run: rustup update stable && rustc --version
      - name: Build (command line + graphical installer)
        shell: bash
        working-directory: patcher/tfpatch
        run: cargo build --release --locked
      - name: Test
        shell: bash
        working-directory: patcher/tfpatch
        run: cargo test --release --locked --lib
      - name: Smoke test of the GUI (Linux, virtual display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxkbcommon-x11-0
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          xvfb-run -a timeout 12 patcher/tfpatch/target/release/tfpatch-gui
          code=$?
          echo "exit code: $code (124 = still running when the timeout hit)"
          [ "$code" -eq 124 ]
      - name: Rename binaries
        shell: bash
        run: |
          cp "patcher/tfpatch/target/release/${{ matrix.cli }}" "${{ matrix.cli_asset }}"
          cp "patcher/tfpatch/target/release/${{ matrix.gui }}" "${{ matrix.gui_asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            ${{ matrix.cli_asset }}
            ${{ matrix.gui_asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --repo "$REPO" --clobber
